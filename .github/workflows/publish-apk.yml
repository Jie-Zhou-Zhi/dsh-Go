name: publish-apk

# 把 build-apk 的产物搬到一个 Release，得到可直接下载的公开链接：
#   https://github.com/<owner>/<repo>/releases/download/<tag>/app-arm64-release.apk
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "build-apk 那次运行的 run id"
        required: true
      tag:
        description: "Release 标签"
        required: true
        default: "local-build"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出构建产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --name dsh-go-arm64-apk --dir out
          find out -type f | head -20
          du -sh out

      - name: 建立 Release 并上传 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1 || \
            gh release create "$tag" --repo "${{ github.repository }}" \
              --title "本地构建 $tag" \
              --notes "换包名（io.github.ccch1mneyyy.dshgo.local）的 arm64 测试包，debug 签名，含 Linux 运行时。"
          find out -name '*.apk' -print0 | xargs -0 -I{} gh release upload "$tag" "{}" --repo "${{ github.repository }}" --clobber
          echo "下载地址: ${{ github.server_url }}/${{ github.repository }}/releases/download/$tag/app-arm64-release.apk"
