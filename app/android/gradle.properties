org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
kotlin.daemon.jvmargs=-Xmx1g
# Flutter's plugin otherwise fills defaultConfig's abiFilters with every ABI it
# supports, and a flavor's filter only adds to that: the arm64 APK carried
# armeabi-v7a and x86_64 plugin libraries with no Flutter engine beside them.
disable-abi-filtering=true

# 本地构建换一个安装包名，装到官方版旁边：取消注释并改成你要的名字。
# 只影响安装包名（和静态快捷方式的 targetPackage），不影响 Kotlin 命名空间。
# dshAppId=com.example.dshgo
